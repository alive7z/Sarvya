x-runtime: &runtime
  build: ./backend
  init: true
  restart: unless-stopped
  environment: &environment
    NODE_ENV: production
    ACCESS_USER: ${ACCESS_USER:-}
    ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
    PORT: 3000
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    REDIS_URL: redis://redis:6379
    DATA_DIR: /app/data
    SCAN_QUEUE_NAME: sarvya-scans
    SCAN_GLOBAL_CONCURRENCY: ${SCAN_GLOBAL_CONCURRENCY:-2}
    SCAN_WORKER_CONCURRENCY: ${SCAN_WORKER_CONCURRENCY:-1}
    SCAN_ATTEMPTS: ${SCAN_ATTEMPTS:-3}
    SCAN_BACKOFF_MS: ${SCAN_BACKOFF_MS:-1000}
    SCAN_JOB_TIMEOUT_MS: ${SCAN_JOB_TIMEOUT_MS:-180000}
    SCAN_NAVIGATION_TIMEOUT_MS: ${SCAN_NAVIGATION_TIMEOUT_MS:-20000}
  volumes:
    - scan-data:/app/data
  depends_on:
    redis:
      condition: service_healthy
  security_opt:
    - seccomp=./backend/seccomp_profile.json
  shm_size: 256mb
  stop_grace_period: 40s

services:
  api:
    <<: *runtime
    environment:
      <<: *environment
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_SESSION_SECRET: ${GITHUB_SESSION_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      GITHUB_OAUTH_SCOPE: ${GITHUB_OAUTH_SCOPE:-public_repo}
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1g
    cpus: 1
    pids_limit: 256

  worker:
    <<: *runtime
    command: ["node", "src/workers/scanWorker.js"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 512

  monitoring:
    <<: *runtime
    command: ["node", "src/workers/monitorWorker.js"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scan-data:
  redis-data:
